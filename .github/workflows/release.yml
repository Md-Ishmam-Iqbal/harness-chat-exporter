name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build and smoke test
        shell: bash
        run: |
          executable="hce"
          if [ "${RUNNER_OS}" = "Windows" ]; then executable="hce.exe"; fi
          go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "${executable}" ./cmd/hce
          "./${executable}" version
          "./${executable}" --help
      - name: Test Windows installer end to end
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Version "${{ github.ref_name }}"

  quality:
    name: Static and vulnerability checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  installers:
    name: Validate installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unix installer
        run: sh -n install.sh
      - name: Validate Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs:
      - test
      - quality
      - installers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="hce_${GOOS}_${GOARCH}"
          mkdir -p package dist
          if [ "${GOOS}" = "windows" ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o package/hce.exe ./cmd/hce
            cp README.md package/README.md
            (cd package && zip -q "../dist/${name}.zip" hce.exe README.md)
          else
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o package/hce ./cmd/hce
            cp README.md package/README.md
            tar -C package -czf "dist/${name}.tar.gz" hce README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hce-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hce-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum hce_* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
          fi
