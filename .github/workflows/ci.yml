name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build and smoke test
        shell: bash
        run: |
          executable="hce"
          if [ "${RUNNER_OS}" = "Windows" ]; then executable="hce.exe"; fi
          go build -trimpath -ldflags "-X main.version=ci-test" -o "${executable}" ./cmd/hce
          "./${executable}" version
          "./${executable}" --help
      - name: Test Windows installer end to end
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Version "ci-test"

  quality:
    name: Static and vulnerability checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  installers:
    name: Validate installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unix installer syntax
        run: sh -n install.sh
      - name: Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
